spring.application.name=employee-microservice
server.port=${PORT:8080}

# File-based H2 database: data is retained across application restarts.
spring.datasource.url=jdbc:h2:file:./data/employees;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Keep the H2 console disabled outside local development.
spring.h2.console.enabled=false
